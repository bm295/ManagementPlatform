services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: management-platform-api
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__PlatformDatabase: "Server=sqlserver,1433;Database=ManagementPlatform;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "5247:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: management-platform-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_password123 -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
